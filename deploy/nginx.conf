# Static SPA (M9). The API and the calculation WebSocket are served by the
# backend behind its own load balancer (same origin via the edge/gateway, or
# VITE_MARINE_API_BASE pointing at it).
server {
  listen 8080;
  root /usr/share/nginx/html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
